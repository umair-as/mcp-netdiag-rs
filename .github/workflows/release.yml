name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

# Default to read-only. Only the `publish` job, which runs no project or
# dependency code, gets `contents: write`.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds, tests and packages with a read-only token. `cargo test` / `cargo
  # build` run dependency build scripts and proc-macros, so this job must not
  # hold a token that can push tags or create releases.
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a commit; the `stable` ref name is lost when pinning, so
        # the toolchain must be named explicitly via the input below.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          cargo_version="$(
            cargo metadata --format-version 1 --no-deps \
              | jq -r \
                '.packages[] | select(.name == "mcp-netdiag-rs") | .version'
          )"
          if [[ "$VERSION" != "$cargo_version" ]]; then
            echo "Requested version $VERSION does not match" \
              "Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      # Build the example sub-crate too, so a release cannot ship with it
      # silently broken.
      - name: Build example client
        run: cargo build --locked --manifest-path examples/minimal-mcp-client/Cargo.toml

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          asset="mcp-netdiag-rs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          staging="mcp-netdiag-rs-v${VERSION}-x86_64-unknown-linux-gnu"

          mkdir "$staging"
          cp target/release/mcp-netdiag-rs \
            README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar -czf "$asset" "$staging"
          sha256sum "$asset" > "${asset}.sha256"

          mkdir dist
          mv "$asset" "${asset}.sha256" dist/

      - name: Verify packaged binary version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          output="$(target/release/mcp-netdiag-rs --version)"
          if [[ "$output" != "mcp-netdiag-rs $VERSION" ]]; then
            echo "Unexpected binary version: $output" >&2
            exit 1
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.13.1
          config: cliff.toml
          # `inputs.version` is interpolated into the action's shell command.
          # Safe only because "Validate release request" above has already
          # restricted it to [0-9A-Za-z.-]; keep that check first and strict.
          args: --unreleased --tag v${{ inputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
          # Re-running all jobs re-uploads under the same name in this run.
          overwrite: true
          # Long enough to re-run a failed `publish` job later.
          retention-days: 7

  # Holds the write token but never checks out or runs repository code: it
  # only downloads the packaged assets and calls `gh release create`.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          asset="dist/mcp-netdiag-rs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          args=(
            "v$VERSION"
            "$asset"
            "${asset}.sha256"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "mcp-netdiag-rs $VERSION"
            --notes-file RELEASE_NOTES.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
