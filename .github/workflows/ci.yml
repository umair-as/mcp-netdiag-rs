name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a commit; the `stable` ref name is lost when pinning, so
        # the toolchain must be named explicitly via the input below.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      # Build the example sub-crate too, so it cannot silently rot.
      - name: Build example client
        run: cargo build --locked --manifest-path examples/minimal-mcp-client/Cargo.toml

  # Builds on the declared MSRV (Cargo.toml `rust-version`) so a dependency
  # bump that raises it fails here instead of silently breaking the promise.
  msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.88.0"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check on MSRV
        run: cargo check --locked --all-targets

      - name: Check example client on MSRV
        run: cargo check --locked --manifest-path examples/minimal-mcp-client/Cargo.toml
