[package]
name = "mcp-netdiag-rs"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stateless MCP server exposing read-only Linux network and system diagnostics over stdio."
repository = "https://github.com/umair-as/mcp-netdiag-rs"
readme = "README.md"
# MSRV is set by the dependency tree, not this crate: rmcp 3.x and its
# darling dependency need 1.88. Edition 2021 is retained for this
# crate. Keep in sync with the `msrv` job's toolchain in ci.yml.
rust-version = "1.88"
# MSRV-aware resolution: rmcp 3.x allows `uuid` releases that need a newer
# toolchain, and this keeps the lockfile on versions that build at 1.88.
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# O_NOFOLLOW / geteuid() for the audit-journal open (see mcp/journal.rs).
libc = "0.2"
# MCP protocol layer. Default features already include `macros` (for
# #[tool], #[tool_router], #[tool_handler]) and `server`; `transport-io`
# is enabled for the stdio transport.
rmcp = { version = "3.9", features = ["transport-io"] }
schemars = "1.0"

[dev-dependencies]
assert_matches = "1"
tempfile = "3"
